name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # TEMP until careers.myoleagroup.com DNS lands: serve from the repo
      # subpath. To go custom-domain: delete the env line below and restore
      # public/CNAME (see GO-LIVE-CHECKLIST.md).
      - name: Verify lead delivery configuration
        env:
          VITE_N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          if [ -z "$VITE_N8N_WEBHOOK_URL" ]; then
            echo "N8N_WEBHOOK_URL is required; refusing to deploy a form that cannot deliver leads."
            exit 1
          fi
      - run: npm run build
        env:
          VITE_BASE: /olea-careers/
          VITE_N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
